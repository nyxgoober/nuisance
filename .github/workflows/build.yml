name: Build & Release

on:
  push:
    branches: [main, rust]
    tags: ["v*", "V*"]
  pull_request:
    branches: [main, rust]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests
        run: cargo test --locked --all-targets

  build:
    name: Build (${{ matrix.artifact }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ─────────────────────────────────────────────────────
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: nuisance-linux-x86_64-musl
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nuisance-linux-x86_64-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: nuisance-linux-aarch64-gnu
            archive: tar.gz

          # ── Termux / Android Bionic libc (API 24+) ────────────────────
          - os: ubuntu-latest
            target: aarch64-linux-android
            artifact: nuisance-android-bionic-aarch64
            archive: tar.gz
            android: true
            ndk_clang: aarch64-linux-android24-clang
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            artifact: nuisance-android-bionic-armv7
            archive: tar.gz
            android: true
            ndk_clang: armv7a-linux-androideabi24-clang
          - os: ubuntu-latest
            target: x86_64-linux-android
            artifact: nuisance-android-bionic-x86_64
            archive: tar.gz
            android: true
            ndk_clang: x86_64-linux-android24-clang

          # ── macOS ─────────────────────────────────────────────────────
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nuisance-macos-aarch64
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: nuisance-macos-x86_64
            archive: tar.gz

          # ── Windows ───────────────────────────────────────────────────
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nuisance-windows-x86_64
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: nuisance-windows-aarch64
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain & target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux cross-compilation toolchains
        if: runner.os == 'Linux' && !matrix.android
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - name: Configure Android NDK (Bionic libc) linker
        if: matrix.android == true
        run: |
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d "${ANDROID_SDK_ROOT}/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "Installing Android NDK via sdkmanager..."
            "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
            NDK_DIR="${ANDROID_SDK_ROOT}/ndk/27.2.12479018"
          fi
          TOOLCHAIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          LINKER="${TOOLCHAIN}/${{ matrix.ndk_clang }}"
          AR="${TOOLCHAIN}/llvm-ar"
          TARGET_UPPER=$(echo "${{ matrix.target }}" | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${LINKER}" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${TARGET_UPPER}_AR=${AR}" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix / Android archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/nuisance" dist/nuisance
          chmod +x dist/nuisance
          cp README.md nuisancestamper.html dist/
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" nuisance README.md nuisancestamper.html
          shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/nuisance.exe" "dist/nuisance.exe"
          Copy-Item "README.md", "nuisancestamper.html" "dist/"
          Compress-Archive -Path "dist/*" -DestinationPath "${{ matrix.artifact }}.zip" -Force
          $hash = (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii "${{ matrix.artifact }}.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.${{ matrix.archive }}
            ${{ matrix.artifact }}.${{ matrix.archive }}.sha256

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
